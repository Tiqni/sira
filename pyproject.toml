[project]
name = "sira"
version = "1.4.0"
description = "Multi-agent AI that tailors your resume to a job posting without inventing facts."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Emad Mokhtar", email = "me@emadmokhtar.com" }]
keywords = ["resume", "cv", "job-search", "ats", "pydantic-ai", "llm", "agents"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "aiofiles>=25.1.0",
    "html2text>=2025.4.15",
    "jinja2>=3.1",
    "markdown>=3.10",
    "markdown-pdf>=1.10",
    "markitdown[docx,pdf]>=0.1.0",
    "platformdirs>=4",
    "playwright>=1.56.0",
    "pydantic-ai[dbos,groq,mistral,cohere,bedrock]>=2.43,<3",
    "pymupdf>=1.26",
    "python-docx>=1.1.0",
    "rich>=14.2.0",
    "typer>=0.25.1",
]

[project.optional-dependencies]
# xAI moved to the native `xai-sdk` in pydantic-ai 2.x. That SDK pins
# `packaging<26`, which conflicts with the `commitizen` dev tool, so xAI
# support is an opt-in extra: `uv sync --extra xai --no-dev`.
xai = ["pydantic-ai[xai]>=2.43,<3"]
# Optional local prompt-injection classifier (Meta Llama Prompt Guard 2) that
# runs on top of the built-in regex scan. Heavy (torch + transformers) and the
# default model is gated on Hugging Face, so it is opt-in:
# `uv sync --extra guard`.
guard = ["transformers>=4.45", "torch>=2.2"]

[project.scripts]
sira = "sira.main:run"

[project.urls]
Homepage = "https://github.com/Tiqni/sira"
Repository = "https://github.com/Tiqni/sira"
Issues = "https://github.com/Tiqni/sira/issues"
Changelog = "https://github.com/Tiqni/sira/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sira"]

# The source distribution carries the package and its tests only. Hatchling
# always adds pyproject.toml, README.md and LICENSE; everything else in the
# repository (docs site, CI, dev guides, cover image, lock file) is not part
# of the release.
[tool.hatch.build.targets.sdist]
only-include = ["sira", "tests", "CHANGELOG.md"]

[tool.uv]
# The `xai` extra and the `dev` group cannot be installed together
# (xai-sdk needs packaging<26, commitizen needs packaging>=26).
conflicts = [[{ extra = "xai" }, { group = "dev" }]]

[dependency-groups]
dev = [
    "anyio>=4.11.0",
    "commitizen>=4.15.1",
    "pytest>=8.0.0",
    "pytest-anyio>=0.0.0",
    "pytest-cov>=7.1.0",
    "pytest-subtests>=0.13.0",
    "ruff>=0.14.6",
]
# Documentation site (mkdocs-material). Kept in its own group so `uv sync`
# for day-to-day work does not pull it in; CI installs it with
# `uv sync --group docs`.
docs = [
    # Capped below 2.0: MkDocs 2.0 drops the plugin system with no migration
    # path, which would break mkdocs-material and the docs build outright.
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
tag_format = "v$version"
bump_message = "chore(release): bump version $current_version -> $new_version"
version_files = ["pyproject.toml:version"]
update_changelog_on_bump = true

