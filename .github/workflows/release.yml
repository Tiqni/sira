name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      # The built-in GITHUB_TOKEN cannot open pull requests unless the
      # repository enables "Allow GitHub Actions to create and approve pull
      # requests", and pull requests it opens never trigger `on: pull_request`
      # workflows, so CI would never run on a release pull request. A personal
      # access token in RELEASE_TOKEN avoids both problems. Fall back to the
      # built-in token so that pushes with nothing to release still work; the
      # step below fails loudly if a release actually needs the token.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --dev

      - name: Bump version and update changelog
        id: bump
        run: |
          # 3 = NO_COMMITS_FOUND, 21 = NONE_INCREMENT: both mean
          # "nothing to release", which the git diff check below handles.
          uv run cz --no-raise 3,21 bump --yes --files-only
          if git diff --quiet -- pyproject.toml; then
            echo "No bump-eligible commits found — skipping release"
            echo "BUMP_NEEDED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "BUMP_NEEDED=true" >> "$GITHUB_ENV"
          NEW_VERSION=$(uv run cz version --project)
          echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"
          echo "BRANCH=release/v$NEW_VERSION" >> "$GITHUB_ENV"

      # Print the newest release section only: start at the first "## " heading
      # (skipping the changelog preamble) and stop at the next one.
      - name: Extract changelog body
        if: env.BUMP_NEEDED == 'true'
        run: awk '/^## /{if(++c>1) exit} c' CHANGELOG.md > body.md

      - name: Verify release token is configured
        if: env.BUMP_NEEDED == 'true'
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN secret is not set. Create a fine-grained personal access token with Contents: read and write plus Pull requests: read and write on this repository, then add it as the repository secret RELEASE_TOKEN."
            exit 1
          fi

      - name: Push to release branch and create PR
        if: env.BUMP_NEEDED == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add pyproject.toml CHANGELOG.md uv.lock
          git commit -m "chore(release): bump version $NEW_VERSION"
          git push origin "$BRANCH" --force
          # Look the pull request up explicitly. Using `gh pr create || gh pr
          # edit` as a fallback hides the real error from `create` behind a
          # misleading "no pull requests found" from `edit`.
          EXISTING=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" \
              --title "chore(release): bump version $NEW_VERSION" \
              --body-file body.md
          else
            gh pr create \
              --title "chore(release): bump version $NEW_VERSION" \
              --body-file body.md \
              --base main \
              --head "$BRANCH"
          fi

  tag-and-release:
    runs-on: ubuntu-latest
    if: "startsWith(github.event.head_commit.message, 'chore(release):')"
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --dev

      - name: Get version and create tag
        run: |
          VERSION=$(uv run cz version --project)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Extract changelog for release
        run: awk '/^## /{if(++c>1) exit} c' CHANGELOG.md > body.md

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ env.VERSION }}
          bodyFile: "body.md"
          skipIfReleaseExists: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
